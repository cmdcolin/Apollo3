name: Publish Apollo

on:
  push:
    tags: v[0-9]+.[0-9]+.[0-9]+*

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    environment: publish
    steps:
      - name: Check out
        uses: actions/checkout@v5
      # Setup .npmrc file to publish to npm
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: '@apollo-annotation'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build shared
        run: pnpm build
        working-directory: packages/apollo-shared
      - name: Publish
        run: pnpm -r --no-private publish --no-git-checks
  publish-docker:
    needs: [publish-npm]
    uses: ./.github/workflows/docker.yml
    with:
      tag: latest
    secrets: inherit
  deploy:
    needs: [publish-npm, publish-docker]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
    secrets: inherit
