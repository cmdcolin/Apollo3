name: Pull Request

on:
  pull_request:
    paths:
      - '**.tsx?'

jobs:
  build:
    name: Strict lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # Have to build shared before linting so type-based lint rules can
      # run correctly
      - name: Build shared
        run: pnpm build
        working-directory: packages/apollo-shared
      - name: Lint codebase
        run: pnpm eslint --max-warnings 0

      # apollo-shared tests
      - name: Build shared
        run: pnpm build
        working-directory: packages/apollo-shared
      - name: Run apollo-shared tests
        run: pnpm run test:ci
        working-directory: packages/apollo-shared

      # jbrowse-plugin-apollo tests
      - name: Run jbrowse-plugin-apollo tests
        run: pnpm run test:ci
        working-directory: packages/jbrowse-plugin-apollo

      # Entity tests
      - name: Run Jest tests (SQLite backend)
        run: pnpm --filter @apollo-annotation/entities test
        env:
          DB_BACKEND: sqlite

      # Playwright E2E tests
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: packages/jbrowse-plugin-apollo
      - name: Run Playwright tests
        run: pnpm run test:e2e
        working-directory: packages/jbrowse-plugin-apollo

      # CLI tests
      - name: Start apollo
        run: |
          pnpm -C packages/apollo-shared start &
          pnpm -C packages/apollo-collaboration-server test:cli:start &
      - name: Run CLI tests
        run: pnpm run test:ci
        working-directory: packages/apollo-cli

      # - name: Run docker tests
      #   working-directory: packages/apollo-cli
      #   run: python3 ./src/test/test_docker.py
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  test-postgresql:
    name: Test with PostgreSQL backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: apollo
          POSTGRES_PASSWORD: apollo
          POSTGRES_DB: apollo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apollo" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
        working-directory: packages/apollo-shared
      - name: Run entity tests (PostgreSQL)
        run: pnpm --filter @apollo-annotation/entities test
        env:
          DB_BACKEND: postgresql
          DB_CONNECTION_URL: postgres://apollo:apollo@localhost:5432/apollo_test
