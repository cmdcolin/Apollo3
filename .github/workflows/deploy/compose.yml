services:
  apollo-collaboration-server:
    image: ghcr.io/gmod/apollo-collaboration-server:${DOCKER_TAG}
    depends_on:
      db:
        condition: service_healthy
    environment:
      NAME: Apollo demo server
      DB_BACKEND: postgresql
      DB_CONNECTION_URL: postgresql://apollo:apollo@db:5432/apollo
      FILE_UPLOAD_FOLDER: /data/uploads
      LOG_LEVELS: error,warn,log,debug
      NO_COLOR: true
      DEFAULT_NEW_USER_ROLE: user
      URL: ${URL}
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ALLOW_ROOT_USER: true
      ROOT_USER_PASSWORD: ${ROOT_USER_PASSWORD}
    volumes:
      - uploaded-files-volume:/data/uploads
    restart: unless-stopped

  client:
    build:
      context: .
    depends_on:
      - apollo-collaboration-server
    ports:
      - ${PORT}:80
    volumes:
      - /home/ec2-user/deployment/data-${ENVIRONMENT}/:/usr/local/apache2/htdocs/data/
    restart: unless-stopped

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: apollo
      POSTGRES_PASSWORD: apollo
      POSTGRES_DB: apollo
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U apollo']
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: null
  uploaded-files-volume: null
