worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    keepalive_timeout 65;

    # Larger genomic files (BAM, CRAM) need bigger buffers for proxy headers
    proxy_buffer_size       16k;
    proxy_buffers           4 32k;
    proxy_busy_buffers_size 64k;

    # Timeouts for long-running API requests (GFF export, large uploads)
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;

    # Max upload size (GFF/FASTA uploads go through the API)
    client_max_body_size 500m;

    server {
        listen 80;
        server_name _;

        # --- Static files: served by nginx directly ---

        # JBrowse UI + genomic data files (BAM, CRAM, BigWig, VCF, etc.)
        # This is the high-performance path: nginx uses sendfile() for
        # zero-copy serving and handles Range headers natively.
        root /data/jbrowse;
        location / {
            # Try static file first, then fall back to the NestJS app
            try_files $uri @backend;
        }

        # Uploaded evidence track files (stored by checksum in FILE_UPLOAD_FOLDER).
        # Tracks reference these as /files/<checksum>. Serving them directly
        # from nginx bypasses Node.js entirely for large BAM/CRAM byte-range fetches.
        # Note: uploaded files are gzip-compressed on disk, so we set the
        # Content-Encoding header. Clients that don't accept gzip will need
        # the /files/:id API endpoint instead (handled by @backend fallback).
        location /files/ {
            alias /data/uploads/;
            add_header Content-Encoding gzip;
        }

        # config.json is dynamic (built from DB track configs) — must proxy to NestJS
        location = /config.json {
            proxy_pass http://apollo:3999;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /jbrowse/config.json {
            proxy_pass http://apollo:3999;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- API + WebSocket: proxied to NestJS ---

        location @backend {
            proxy_pass http://apollo:3999;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (socket.io)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Direct match for socket.io path
        location /socket.io/ {
            proxy_pass http://apollo:3999;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
